<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IsoSync — Progress Analytics Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000;--cyan:#00f2ff;--text:#e0e0e0;--muted:rgba(0,242,255,.4)}
body{font-family:'Courier New','Fira Code',monospace;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:720px;background:#000;border:1px solid var(--cyan);padding:32px;position:relative}
.container::before{content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
.container::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
h2{font-size:22px;color:#fff;font-weight:900;text-transform:uppercase;margin-bottom:6px;letter-spacing:1px}
.subtitle{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:3px;margin-bottom:24px;padding-bottom:12px;border-bottom:1px solid rgba(0,242,255,.3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:10px;color:var(--cyan);text-transform:uppercase;letter-spacing:1px}
.field input,.field textarea{background:#0a0a0a;border:1px solid var(--cyan);color:var(--cyan);padding:10px 14px;font-family:inherit;font-size:13px;transition:all .2s}
.field input:focus,.field textarea:focus{outline:none;background:#111;box-shadow:0 0 10px rgba(0,242,255,.2)}
.field textarea{min-height:80px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:rgba(0,242,255,.25)}
.commit-btn{width:100%;margin-top:32px;padding:16px;background:var(--cyan);color:#000;border:none;font-family:inherit;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.2em;cursor:pointer;transition:all .2s}
.commit-btn:hover{background:#fff;box-shadow:0 0 20px rgba(0,242,255,.4)}
.commit-btn:active{transform:scale(.98)}
.disclaimer{margin-top:24px;font-size:10px;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:2px;opacity:.5}
.vault-entries{margin-top:24px}
.vault-entries h3{font-size:11px;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid rgba(0,242,255,.15)}
.entry{background:rgba(0,242,255,.03);border:1px solid rgba(0,242,255,.1);padding:12px;margin-bottom:8px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.entry .e-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.entry .e-date{font-size:10px;color:var(--muted)}
.entry .e-status{font-size:10px;color:var(--cyan);background:rgba(0,242,255,.1);padding:2px 8px;border:1px solid rgba(0,242,255,.2)}
.entry .e-body{font-size:11px;color:rgba(0,242,255,.6);line-height:1.5}
.entry .e-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.toast{position:fixed;bottom:20px;right:20px;padding:14px 20px;background:var(--cyan);color:#000;font-family:inherit;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;animation:toastIn .4s ease;opacity:0;transform:translateY(10px);transition:all .3s}
.toast.show{opacity:1;transform:translateY(0)}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.scanline{position:fixed;top:0;left:0;right:0;height:2px;background:rgba(0,242,255,.15);animation:scan 4s linear infinite;pointer-events:none;z-index:999}
@keyframes scan{0%{top:0}100%{top:100vh}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.container{padding:20px}}
</style>
</head>
<body>
<div class="scanline"></div>
<div class="container">
  <h2>Progress Analytics Engine</h2>
  <div class="subtitle">IsoSync · Resonance Verification System</div>

  <div class="grid">
    <div class="field">
      <label>Target Physiological Site</label>
      <input type="text" id="targetOrgan" placeholder="e.g. Hepatic Node">
      <label style="margin-top:16px">Pre-Session Baseline</label>
      <textarea id="baselineFeeling" placeholder="Describe state before resonance..."></textarea>
    </div>
    <div class="field">
      <label>Post-Session Resonance Response</label>
      <textarea id="postSessionFeeling" placeholder="Describe state after resonance..."></textarea>
      <label style="margin-top:16px">Structural/Clinical Notes</label>
      <input type="text" id="notes" placeholder="Any detected stability changes?">
    </div>
  </div>

  <button class="commit-btn" onclick="commitEntry()">Commit Progress to Data Engine</button>

  <div class="vault-entries" id="vaultEntries"></div>

  <div class="disclaimer">Data is hashed and stored in your IsoSync Vault. Your logs contribute to the Global Resonance Research Database.</div>
</div>

<div class="toast" id="toast"></div>

<script>
const vault = [];

function commitEntry() {
  const target = document.getElementById('targetOrgan').value.trim();
  const baseline = document.getElementById('baselineFeeling').value.trim();
  const post = document.getElementById('postSessionFeeling').value.trim();
  const notes = document.getElementById('notes').value.trim();

  if (!target && !baseline && !post) {
    showToast('ERROR: No data entered');
    return;
  }

  const entry = {
    id: '0x' + Math.random().toString(16).substr(2, 8),
    target: target || 'N/A',
    baseline: baseline || 'N/A',
    postSession: post || 'N/A',
    notes: notes || 'N/A',
    date: new Date().toLocaleDateString(),
    time: new Date().toLocaleTimeString(),
    status: 'Resonance Verified'
  };

  vault.unshift(entry);
  renderVault();

  // Clear form
  document.getElementById('targetOrgan').value = '';
  document.getElementById('baselineFeeling').value = '';
  document.getElementById('postSessionFeeling').value = '';
  document.getElementById('notes').value = '';

  showToast('ENTRY COMMITTED TO ANALYTICS VAULT');

  console.log('Saving to Analytics Engine:', entry);
}

function renderVault() {
  const el = document.getElementById('vaultEntries');
  if (vault.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = '<h3>Vault Entries (' + vault.length + ')</h3>' +
    vault.map(e =>
      '<div class="entry">' +
      '<div class="e-header"><span class="e-date">' + e.date + ' ' + e.time + '</span><span class="e-status">' + e.status + '</span></div>' +
      '<div class="e-body">' +
      '<div class="e-label">Target Site</div>' + e.target +
      (e.baseline !== 'N/A' ? '<div class="e-label">Baseline</div>' + e.baseline : '') +
      (e.postSession !== 'N/A' ? '<div class="e-label">Post-Session</div>' + e.postSession : '') +
      (e.notes !== 'N/A' ? '<div class="e-label">Notes</div>' + e.notes : '') +
      '<div style="margin-top:4px;font-size:9px;color:var(--muted)">ID: ' + e.id + '</div>' +
      '</div></div>'
    ).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  setTimeout(() => { t.className = 'toast'; }, 3000);
}
</script>
</body>
</html>
